
services:
  # -----------------------------
  # MongoDB
  # -----------------------------
  mongo:
    image: mongo:8
    restart: unless-stopped

    ports:
      - "27017:27017"

    volumes:
      - mongo_data:/data/db

    networks:
      - fixnear-network

    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "db.adminCommand('ping').ok"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # -----------------------------
  # User Service
  # -----------------------------
  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile

    restart: unless-stopped

    env_file:
      - ./services/user-service/.env

    environment:
      PORT: "4001"
      MONGODB_URI: mongodb://mongo:27017/fixnear-users

    ports:
      - "4001:4001"

    depends_on:
      mongo:
        condition: service_healthy

    networks:
      - fixnear-network

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # -----------------------------
  # API Gateway
  # -----------------------------
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile

    restart: unless-stopped

    env_file:
      - ./services/api-gateway/.env

    environment:
      PORT: "4000"
      USER_SERVICE_URL: http://user-service:4001

    ports:
      - "4000:4000"

    depends_on:
      user-service:
        condition: service_healthy

    networks:
      - fixnear-network

networks:
  fixnear-network:
    driver: bridge

volumes:
  mongo_data:
